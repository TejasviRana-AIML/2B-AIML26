<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>triangle pattern using arrow functions</title>
    <script>
        let n=parseInt(prompt("Enter the number of rows: "));
        let pattern=()=>{
            for(let i=1;i<=n;i++){
                for(let j=1;j<=i;j++){
                    document.write("*");
                }
                document.write("<br>");
            }
        }
        pattern();
    </script>
</head>

</body>
</html>
