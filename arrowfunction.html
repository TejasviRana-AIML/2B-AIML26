<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow functions</title>
    <script>
        hello=()=>document.write("Hello World"+"<br>");
        hello();

        let marks=90;
        physics=marks=>{return `${marks}`;};
        document.write( physics(marks)+"<br>");

        let firstName="Tejasvi";
        let lastName="Rana";
        fullName=(first,last)=>`${first} ${last}`;
        document.write(`My Name is ${fullName(firstName,lastName)}`);

        

        
    </script>
</head>
<body>
    
</body>
</html>
